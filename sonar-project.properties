sonar.projectKey=refinamento-planejamento-tecnico
sonar.qualitygate.wait=true

sonar.sources=decompor-tasks/src,preparar-implementacao/src,refinar-tecnicamente/src
sonar.tests=decompor-tasks/tests,preparar-implementacao/tests,refinar-tecnicamente/tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=decompor-tasks/coverage.xml,preparar-implementacao/coverage.xml,refinar-tecnicamente/coverage.xml
sonar.host.url=https://sonar.pedroct.com.br
sonar.coverage.exclusions=**/tests/**

# Cada skill é instalável avulsa, então cliente_azure_devops.py é cópia vendorizada entre
# skills de propósito (cada uma nunca importa módulo de skill irmã — ver o docstring do
# próprio arquivo). Duplicação entre elas é arquitetural, não um defeito a corrigir; sem esta
# exclusão o CPD (duplicated lines) do Sonar as reporta em vão.
sonar.cpd.exclusions=**/cliente_azure_devops.py
